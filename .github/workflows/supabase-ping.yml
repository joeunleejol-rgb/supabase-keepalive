name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl --fail --show-error --silent \
            "${{ secrets.SUPABASE_URL }}/rest/v1/articles?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
